/*
 * Goodix GT911 touch config for the Rithum Switch 480x480 panel.
 *
 * Byte-exact dump of the factory-provisioned GT911 config (registers
 * 0x8047-0x80FF incl. checksum) read over i2c from a pristine factory
 * unit (192.168.1.120, 4.4.143) that had never run this kernel. X_max=480,
 * Y_max=480, config version 0x41, checksum valid.
 *
 * This is the ONLY surviving copy of this panel-specific config: the
 * GT911 stores it in on-chip flash and it is not in any vendor source
 * tree. A dev unit whose chip was clobbered (e.g. by an earlier build that
 * set GTP_DRIVER_SEND_CFG=1 with tp-size=9110, pushing the generic
 * 1920x1200 gtp_dat_gt9110) can be restored by writing these bytes to
 * 0x8047 then 0x01 to 0x8100 (config-fresh). Normal operation keeps
 * GTP_DRIVER_SEND_CFG=0 so the driver never overwrites the chip's config.
 *
 * Restore caveat, learned on unit 0002: the GT9xx silently ignores a
 * config whose version byte (offset 0, register 0x8047) is LOWER than
 * the one it holds. The generic table the bad builds push carries
 * version 0x47, so writing this file (version 0x41) onto a clobbered
 * chip is accepted without error and changes nothing. To restore such a
 * chip, bump byte 0 above the stored version (0x48 was used) and
 * recompute the checksum at offset 184 (register 0x80FF) so that
 * (sum of bytes 0x8047..0x80FE + checksum) & 0xff == 0, i.e. checksum =
 * (-sum) & 0xff; every other byte stays factory-exact. Read 0x8047 back
 * after the write and the config-fresh strobe to confirm it took. A
 * stored version above 0x47 also stops the generic table from
 * installing again on that chip; any chip still at 0x41 is unprotected.
 */
